%YAML 1.2
---
$id: http://devicetree.org/schemas/media/thead,th1520-vc8000e.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: T-HEAD TH1520 Hantro VC8000D video encoder

maintainers:
  - Han Gao <gaohan@iscas.ac.cn>

description:
  The VC8000E encoder and its internal address translation unit occupy
  separate register banks.

properties:
  compatible:
    const: thead,th1520-vc8000e

  reg:
    items:
      - description: Encoder core registers
      - description: Internal MMU registers

  reg-names:
    items:
      - const: encoder
      - const: mmu

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: AXI bus clock
      - description: Encoder core clock
      - description: APB register clock

  clock-names:
    items:
      - const: aclk
      - const: cclk
      - const: pclk

  resets:
    items:
      - description: APB register interface reset
      - description: Encoder core reset

  reset-names:
    items:
      - const: apb
      - const: core

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - clocks
  - clock-names
  - resets
  - reset-names
  - power-domains

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/thead,th1520-clk-ap.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/power/thead,th1520-power.h>
    #include <dt-bindings/reset/thead,th1520-reset.h>

    video-codec@ecc11000 {
        compatible = "thead,th1520-vc8000e";
        reg = <0xecc11000 0x1000>, <0xecc14000 0x1000>;
        reg-names = "encoder", "mmu";
        interrupts = <133 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&clk_vp CLK_VENC_ACLK>,
                 <&clk_vp CLK_VENC_CCLK>,
                 <&clk_vp CLK_VENC_PCLK>;
        clock-names = "aclk", "cclk", "pclk";
        resets = <&rst_vp TH1520_RESET_ID_VENC_APB>,
                 <&rst_vp TH1520_RESET_ID_VENC_CORE>;
        reset-names = "apb", "core";
        power-domains = <&aon TH1520_VENC_PD>;
    };
