%YAML 1.2
---
$id: http://devicetree.org/schemas/media/zhihe,a210-vc9000d.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Zhihe A210 Hantro VC9000D video decoder

maintainers:
  - Han Gao <gaohan@iscas.ac.cn>

description:
  The VC9000D decoder supports H.264, HEVC and VP9. Its register bank
  follows a command unit that this binding does not describe.

properties:
  compatible:
    const: zhihe,a210-vc9000d

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: AXI bus clock
      - description: Decoder core clock
      - description: APB register clock

  clock-names:
    items:
      - const: aclk
      - const: cclk
      - const: pclk

  resets:
    items:
      - description: APB register interface reset
      - description: AXI bus reset
      - description: Decoder core reset

  reset-names:
    items:
      - const: apb
      - const: axi
      - const: core

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - resets
  - reset-names
  - power-domains

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        video-codec@6800800 {
            compatible = "zhihe,a210-vc9000d";
            reg = <0x0 0x06800800 0x0 0xc00>;
            interrupts = <229 IRQ_TYPE_LEVEL_HIGH>;
            clocks = <&scmi_clk 163>, <&scmi_clk 164>, <&scmi_clk 165>;
            clock-names = "aclk", "cclk", "pclk";
            resets = <&scmi_reset 144>, <&scmi_reset 146>, <&scmi_reset 145>;
            reset-names = "apb", "axi", "core";
            power-domains = <&scmi_power 13>;
        };
    };
