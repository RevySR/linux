%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/zhihe,a210-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Zhihe A210 pin controller

maintainers:
  - Zhiguo Zhu <zhiguo.zhu@linux.alibaba.com>

description: |
  Pinmux and pinconf controller of the Zhihe A210 RISC-V SoC.

  The pads of the A210 are split into four groups, each managed by its
  own pad controller with a separate register range:

    AON pad controller   -> zhihe,a210-aon-pinctrl
    Peripheral 1 pads    -> zhihe,a210-peri1-pinctrl
    Peripheral 2 pads    -> zhihe,a210-peri2-pinctrl
    Peripheral 3 pads    -> zhihe,a210-peri3-pinctrl

  Each pad can be muxed individually to up to 8 different functions,
  though for most pads only a few of those settings are valid. A few pads
  in the AON group do not support muxing or configuration at all.

  AON, peripheral 1 and peripheral 2 pads support configurable drive
  strength, bias, input enable, Schmitt trigger and slew rate.

  The peripheral 3 controller handles the six dedicated SDIO pads, named
  SDIO_CLK, SDIO_CMD and SDIO_DAT0 to SDIO_DAT3 in the SoC pin list. One
  mux bit selects SDIO or GPIO for all six pads at once, so they must all
  use the same function. Only their bias can be configured, per pad.

properties:
  compatible:
    enum:
      - zhihe,a210-aon-pinctrl
      - zhihe,a210-peri1-pinctrl
      - zhihe,a210-peri2-pinctrl
      - zhihe,a210-peri3-pinctrl

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    const: pclk

  resets:
    maxItems: 1

patternProperties:
  '-[0-9]+$':
    type: object

    description:
      A pinmux group referenced by a consumer's pinctrl phandle. It
      contains one subnode per set of pads sharing the same pinmux and
      pinconf settings.

    additionalProperties: false

    patternProperties:
      '-pins$':
        type: object
        $ref: /schemas/pinctrl/pincfg-node.yaml#

        description:
          A pinctrl node describing the pinmux and pinconf settings of
          one or more pads.

        properties:
          pins:
            $ref: /schemas/pinctrl/pinmux-node.yaml#/properties/pins
            description: List of pads that properties in the node apply to.

          function:
            $ref: /schemas/pinctrl/pinmux-node.yaml#/properties/function
            enum: [ aouart, aouart_ir, aogpio, aoi2c, aospi, jtag, reset,
                    por, pmic, dvs, uart0, uart1, uart2, uart3, uart4,
                    uart5, uart6, uart7, uart8, uart9, uart_ir, gpio,
                    gmac0, gmac1, spi, qspi, pwm, can, i2s0, i2s1, i2s2,
                    i2s3, i2c0, i2c1, i2c2, i2c3, i2c4, i2c5, i2c6, i2c7,
                    i2c7_smb, sdio, isp0, dptx, usb31, sata, hdmi, zmac,
                    bsel, dbgm, cdbg, pdm, tdm, pcie, sen_vclk ]
            description: |
              The mux function to select for the given pins. Functions of
              the same kind share one name, such as spi or pwm, unless a
              pad can select more than one instance. For example GPIO0_16
              selects UART0 or UART1, so the UARTs are named uart0 to
              uart9.

          bias-disable: true

          bias-pull-up: true

          bias-pull-down: true

          drive-strength:
            minimum: 1
            maximum: 25
            description:
              Drive strength in mA. The pads support 1, 2, 3, 5, 7, 8, 10,
              12, 13, 15, 16, 18, 20, 21, 23 and 25 mA. Other values select
              the next higher strength.

          input-enable: true

          input-disable: true

          input-schmitt-enable: true

          input-schmitt-disable: true

          slew-rate:
            maximum: 1

        required:
          - pins

        additionalProperties: false

allOf:
  - if:
      properties:
        compatible:
          const: zhihe,a210-peri3-pinctrl
    then:
      patternProperties:
        '-[0-9]+$':
          patternProperties:
            '-pins$':
              properties:
                pins:
                  items:
                    enum: [ SDIO_CLK, SDIO_CMD, SDIO_DAT0, SDIO_DAT1,
                            SDIO_DAT2, SDIO_DAT3 ]

                function:
                  enum: [ sdio, gpio ]

                drive-strength: false

                input-enable: false

                input-disable: false

                input-schmitt-enable: false

                input-schmitt-disable: false

                slew-rate: false

required:
  - compatible
  - reg
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    pinctrl@2026000 {
        compatible = "zhihe,a210-peri1-pinctrl";
        reg = <0x2026000 0x1000>;
        clocks = <&clk 0>;
        clock-names = "pclk";

        gmac0-0 {
            gmac0-pins {
                pins = "GPIO0_0", "GPIO0_12";
                function = "gmac0";
                bias-disable;
                drive-strength = <13>;
                input-disable;
                input-schmitt-disable;
                slew-rate = <0>;
            };
        };
    };

  - |
    pinctrl@542000 {
        compatible = "zhihe,a210-peri3-pinctrl";
        reg = <0x542000 0x1000>;
        clocks = <&clk 0>;
        clock-names = "pclk";

        sdio-0 {
            clock-pins {
                pins = "SDIO_CLK";
                function = "sdio";
                bias-disable;
            };

            cmd-data-pins {
                pins = "SDIO_CMD", "SDIO_DAT0", "SDIO_DAT1",
                       "SDIO_DAT2", "SDIO_DAT3";
                function = "sdio";
                bias-pull-up;
            };
        };
    };
