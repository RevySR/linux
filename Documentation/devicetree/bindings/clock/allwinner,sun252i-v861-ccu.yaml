%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/allwinner,sun252i-v861-ccu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner V861 Clock Control Unit

maintainers:
  - Han Gao <gaohan@iscas.ac.cn>

properties:
  "#clock-cells":
    const: 1

  "#reset-cells":
    const: 1

  compatible:
    enum:
      - allwinner,sun252i-v861-ccu
      - allwinner,sun252i-v861-r-ccu

  reg:
    maxItems: 1

  clocks:
    minItems: 3
    maxItems: 4

  clock-names:
    minItems: 3
    maxItems: 4

required:
  - "#clock-cells"
  - "#reset-cells"
  - compatible
  - reg
  - clocks
  - clock-names

allOf:
  - if:
      properties:
        compatible:
          enum:
            - allwinner,sun252i-v861-ccu

    then:
      properties:
        clocks:
          items:
            - description: High Frequency Oscillator (usually at 24MHz)
            - description: Low Frequency Oscillator (usually at 32kHz)
            - description: Internal Oscillator

        clock-names:
          items:
            - const: hosc
            - const: losc
            - const: iosc

  - if:
      properties:
        compatible:
          enum:
            - allwinner,sun252i-v861-r-ccu

    then:
      properties:
        clocks:
          items:
            - description: High Frequency Oscillator (usually at 24MHz)
            - description: Low Frequency Oscillator (usually at 32kHz)
            - description: Internal Oscillator
            - description: Peripherals PLL (200 MHz output)

        clock-names:
          items:
            - const: hosc
            - const: losc
            - const: iosc
            - const: pll-periph

additionalProperties: false

examples:
  - |
    clock-controller@2001000 {
        compatible = "allwinner,sun252i-v861-ccu";
        reg = <0x02001000 0x1000>;
        clocks = <&osc24M>, <&rtc 0>, <&rtc 2>;
        clock-names = "hosc", "losc", "iosc";
        #clock-cells = <1>;
        #reset-cells = <1>;
    };

...
